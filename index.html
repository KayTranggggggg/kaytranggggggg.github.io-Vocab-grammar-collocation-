<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Use Practice</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1d2330; --muted:#667085; --line:#e4e7ec;
  --accent:#2f6fde; --accent-soft:#e8f0fd; --ok:#1a7f4b; --ok-soft:#e4f5ec; --bad:#c23934; --bad-soft:#fdecea;
  --warn:#9a6700; --warn-soft:#fff6dd;
  --c-vu:#1f8a70; --c-va:#7a4fd1; --c-gi:#d1562b; --c-ga:#2f6fde; --c-ci:#b4377a;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --panel:#1a1f27; --ink:#e7eaf0; --muted:#98a2b3; --line:#2a313c;
    --accent:#6ea0ff; --accent-soft:#1f2b40; --ok:#4cc38a; --ok-soft:#173226; --bad:#ff7b72; --bad-soft:#3a1d1c;
    --warn:#e3b341; --warn-soft:#3a2f12;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1a1f27; --ink:#e7eaf0; --muted:#98a2b3; --line:#2a313c;
  --accent:#6ea0ff; --accent-soft:#1f2b40; --ok:#4cc38a; --ok-soft:#173226; --bad:#ff7b72; --bad-soft:#3a1d1c;
  --warn:#e3b341; --warn-soft:#3a2f12;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:64px}
.brand{font-weight:700;letter-spacing:.2px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px}
.books{display:flex;gap:8px;overflow-x:auto;flex:1;padding:2px}
.book{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:6px 12px 6px 6px;white-space:nowrap;transition:background .15s,border-color .15s}
.book:hover{border-color:var(--muted)}
.book .ico{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;flex:none}
.book .ico svg{width:22px;height:22px}
.book .bt{display:flex;flex-direction:column;line-height:1.2;text-align:left}
.book .bt b{font-size:13.5px}
.book .bt small{color:var(--muted);font-size:11.5px}
.book.active{border-color:var(--bk);background:color-mix(in srgb,var(--bk) 10%,var(--panel))}
.theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px}
.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 64px)}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:12px;border-bottom:1px solid var(--line)}
.side-head h2{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.units{overflow-y:auto;flex:1;padding:6px}
.unit-link{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:7px 8px;border-radius:8px}
.unit-link:hover{background:var(--bg)}
.unit-link.active{background:var(--accent-soft)}
.unit-link .num{flex:none;min-width:34px;text-align:center;font-weight:700;font-size:12.5px;color:var(--bk);background:color-mix(in srgb,var(--bk) 12%,transparent);border-radius:6px;padding:2px 4px;font-variant-numeric:tabular-nums}
.unit-link .ut{font-size:13.5px;line-height:1.35}
.unit-link .prog{margin-left:auto;flex:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.unit-link .prog.full{color:var(--ok);font-weight:700}
main{overflow-y:auto;min-width:0}
.content{max-width:980px;margin:0 auto;padding:20px 24px 80px}
.crumb{color:var(--muted);font-size:13px}
h1{font-size:26px;line-height:1.25;margin:4px 0 14px}
.tabs{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tab{border:0;background:none;color:var(--muted);padding:9px 14px;border-bottom:2px solid transparent;font-weight:600}
.tab.active{color:var(--ink);border-bottom-color:var(--bk)}
.pager{display:flex;justify-content:space-between;gap:8px;margin:24px 0}
.pager button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 12px;max-width:48%;text-align:left}
.theory{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.theory p{margin:0 0 6px}
.theory .sec{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-weight:700;font-size:16.5px}
.theory .sec:first-child{margin-top:0}
.theory .sec .L{width:28px;height:28px;border-radius:7px;background:var(--bk);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.theory .ex{color:color-mix(in srgb,var(--ink) 80%,var(--bk));}
.theory .bul{padding-left:14px;text-indent:-12px}
.note{border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 14px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.excard{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 18px;overflow:hidden}
.exhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bk) 6%,var(--panel))}
.exhead .id{font-weight:800;color:var(--bk);font-variant-numeric:tabular-nums}
.exhead .score{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.exhead .score.good{color:var(--ok);font-weight:700}
.exbody{padding:14px 16px}
.exline{margin:2px 0;white-space:pre-wrap;word-break:break-word}
.exline.instr{font-weight:600;margin-bottom:6px}
.exline.item{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:4px 0}
.exline.item .txt{flex:1 1 380px}
.gap{display:inline-block;min-width:44px;border-bottom:1.5px solid var(--muted);color:transparent;user-select:none;line-height:1;transform:translateY(-3px)}
.ans-wrap{display:flex;align-items:center;gap:6px;flex:0 1 330px;min-width:220px}
.ans-wrap .lbl{font-size:12px;color:var(--muted);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
.ans{flex:1;min-width:0;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px}
.ans:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.ans.ok{border-color:var(--ok);background:var(--ok-soft)}
.ans.bad{border-color:var(--bad);background:var(--bad-soft)}
.ans.ref{border-color:var(--warn);background:var(--warn-soft)}
.mark{width:18px;text-align:center;font-weight:800}
.mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.ref{color:var(--warn)}
.sol{flex-basis:100%;font-size:13.5px;color:var(--ok);padding-left:2px}
.sol b{color:var(--muted);font-weight:600}
.extra{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.extra h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.extra .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 14px}
.extra .grid .cell{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.extra .grid .cell .sol{padding-left:28px}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 13px;font-weight:600;font-size:13.5px}
.btn.primary{background:var(--bk);border-color:var(--bk);color:#fff}
.btn:hover{filter:brightness(.97)}
.keybox{margin:0 16px 14px;padding:10px 14px;border-radius:10px;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent);white-space:pre-wrap;font-size:14px}
.keybox .kt{font-weight:700;color:var(--ok);display:block;margin-bottom:4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
textarea.free{width:100%;min-height:80px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.tag{font-size:11.5px;border-radius:999px;padding:2px 8px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.hint{font-size:12.5px;color:var(--muted)}
.imgs,.keyall{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 16px}
.imgs summary,.keyall summary{cursor:pointer;font-weight:600;font-size:14px}
.imgrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.imgrow img{max-width:100%;max-height:none;border-radius:8px;border:1px solid var(--line);background:#fff}
.dataBtn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;white-space:nowrap}
.theory b{font-weight:700;color:color-mix(in srgb,var(--ink) 85%,var(--bk))}
.theory .sub{font-weight:700;margin:14px 0 6px;color:var(--bk)}
.theory p.gl{font-size:13.5px;color:var(--muted);margin:0 0 2px}
.theory .figrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:flex-end;margin:10px 0 14px}
.theory .figrow img{border-radius:8px;background:#fff;cursor:zoom-in}
.theory .figrow img.zoom{position:fixed;inset:0;margin:auto;width:auto!important;max-width:96vw;max-height:94vh;z-index:90;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.7)}
.theory .fig{margin:10px 0 14px;text-align:center}
.theory .fig img{max-width:100%;border-radius:8px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.08);cursor:zoom-in}
.theory .fig img.zoom{position:fixed;inset:0;margin:auto;width:auto!important;max-width:96vw;max-height:94vh;z-index:90;cursor:zoom-out;box-shadow:0 0 0 100vmax rgba(0,0,0,.7)}
.btn.ai{margin-left:auto}
.aibox{margin:10px 0 0;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--bk) 8%,var(--panel));border:1px solid color-mix(in srgb,var(--bk) 30%,transparent);font-size:14.5px;line-height:1.55;white-space:pre-wrap}
.aibox .r{margin:4px 0}.aibox .r b{color:var(--bk)}
.aic{font-size:13px;color:var(--muted);margin-top:3px}
#aiDlg{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.45);display:none;place-items:center;padding:16px}
#aiDlg.on{display:grid}
#aiDlg .box{background:var(--panel);color:var(--ink);border-radius:14px;max-width:520px;width:100%;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#aiDlg h3{margin:0 0 8px}#aiDlg label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
#aiDlg input[type=password],#aiDlg input[type=text]{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
#aiDlg .row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#aiDlg .st{font-size:13px;margin-top:8px}
.tab,.pgbtn,.lecbtn{white-space:nowrap}
.pgbtn{margin-left:auto;padding:7px 12px;border-radius:999px;font-size:14px}
#pgPane{position:fixed;top:0;right:0;bottom:0;width:min(46vw,760px);background:var(--panel);border-left:1px solid var(--line);z-index:40;display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
#pgPane.on{display:flex}
#pgPane .ph{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
#pgPane .ph button{margin-left:auto}
#pgPane .pb{overflow:auto;flex:1;padding:10px}
#pgPane img{width:100%;border-radius:6px;background:#fff}
body.pg-on .content{margin-right:min(46vw,760px)}
@media (max-width:900px){#pgPane{width:100vw}body.pg-on .content{margin-right:auto}}
.lecbtn{margin-left:6px;padding:7px 14px;border-radius:999px;font-size:14px}
.theory .tw{overflow-x:auto;margin:8px 0 14px}
.theory table{border-collapse:collapse;width:100%;font-size:14.5px}
.theory td,.theory th{border:1px solid var(--line);padding:6px 10px;vertical-align:top;text-align:left;line-height:1.5}
.theory th{background:color-mix(in srgb,var(--bk) 14%,transparent)}
.theory tr td:first-child{background:color-mix(in srgb,var(--bk) 6%,transparent)}
.theory table.cols td{border:0;background:none!important;padding:4px 12px 4px 0;width:50%}
.theory sup{font-size:10px;color:var(--bk);font-weight:700}
.lec-cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 14px}
/* lecture overlay */
#lec{position:fixed;inset:0;z-index:100;display:none;background:#0d1020;color:#f3f5fb;overflow:hidden}
#lec.on{display:block}
#lec .bg{position:absolute;inset:-20%;filter:blur(60px);opacity:.55}
#lec .bg i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;animation:drift 18s ease-in-out infinite alternate}
#lec .bg i:nth-child(1){background:var(--bk);left:5%;top:10%}
#lec .bg i:nth-child(2){background:#f0a500;right:0;top:40%;animation-duration:23s}
#lec .bg i:nth-child(3){background:#2bb3a3;left:30%;bottom:-10%;animation-duration:27s}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
#lec .top{position:relative;display:flex;align-items:center;gap:12px;padding:14px 20px}
#lec .top .t{font-weight:700;opacity:.9;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lec .x{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;padding:7px 12px}
#lec .stage{position:relative;height:calc(100vh - 150px);display:grid;place-items:center;padding:0 24px}
#lec .slide{width:min(1100px,100%);max-height:100%;overflow:auto;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:start;animation:slidein .6s cubic-bezier(.2,.8,.2,1)}
#lec .slide.noimg{grid-template-columns:1fr}
@keyframes slidein{from{opacity:0;transform:translateY(30px) scale(.98)}to{opacity:1;transform:none}}
#lec .stitle{display:flex;align-items:center;gap:14px;font-size:clamp(22px,3.2vw,36px);font-weight:800;margin:0 0 18px;line-height:1.15}
#lec .stitle .L{width:52px;height:52px;border-radius:14px;background:var(--bk);display:grid;place-items:center;font-size:28px;flex:none;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
#lec .para{font-size:clamp(16px,1.6vw,21px);line-height:1.6;margin:0 0 12px;padding:8px 14px;border-radius:12px;opacity:.38;transition:opacity .4s,background .4s,transform .4s;border-left:4px solid transparent}
#lec .para.done{opacity:.7}
#lec .para.cur{opacity:1;background:rgba(255,255,255,.08);border-left-color:var(--bk);transform:translateX(4px)}
#lec .para b{color:#ffd166;font-weight:700}
#lec .para.cur b{animation:glow 1.2s ease-in-out}
@keyframes glow{0%{text-shadow:0 0 0 transparent}40%{text-shadow:0 0 18px #ffd166}100%{text-shadow:0 0 0 transparent}}
#lec .para i{color:#9fd8ff}
#lec .para table{border-collapse:collapse;width:100%}
#lec .para td,#lec .para th{border:1px solid rgba(255,255,255,.22);padding:6px 10px;vertical-align:top;text-align:left}
#lec .para th{background:rgba(255,255,255,.1)}
#lec .para tr td:first-child{color:#ffd166;font-weight:600}
#lec .pic{max-width:min(380px,34vw);display:flex;flex-direction:column;gap:12px}
#lec .pic img{width:100%;border-radius:14px;background:#fff;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#lec .cover{text-align:center}
#lec .cover h2{font-size:clamp(28px,5vw,56px);margin:10px 0;line-height:1.1;animation:slidein .8s}
#lec .cover .k{opacity:.75;letter-spacing:.2em;text-transform:uppercase;font-size:13px}
#lec .cover svg{width:120px;height:120px;animation:float 4s ease-in-out infinite}
#lec .ctl{position:absolute;left:0;right:0;bottom:0;height:auto;width:auto;border-radius:0;overflow:visible;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.5))}
#lec .ctl button,#lec .ctl select{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:8px 12px;font:inherit}
#lec .ctl select option{color:#000}
#lec .ctl .play{background:var(--bk);font-weight:700;min-width:96px}
#lec .prog{flex:1;min-width:120px;height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
#lec .prog i{display:block;height:100%;background:#ffd166;width:0;transition:width .4s}
#lec .cap{font-size:12.5px;opacity:.75}
@media (max-width:860px){#lec .slide{grid-template-columns:1fr}#lec .pic{max-width:100%}#lec .stage{height:calc(100vh - 190px)}}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.unit-sum{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px;color:var(--muted);font-size:13.5px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--ok)}
@media (max-width: 1500px){ .book .bt small{display:none} }
@media (max-width: 1180px){ .book .bt{display:none} .book{padding:4px} }
@media (max-width: 860px){
  .menu-btn{display:block}
  .layout{grid-template-columns:1fr}
  aside{position:fixed;top:64px;left:0;bottom:0;width:86vw;max-width:340px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .book .bt{display:none}
  .book{padding:4px}
  .brand{display:none}
  .content{padding:14px 16px 80px}
  h1{font-size:21px}
  .ans-wrap{flex-basis:100%}
}
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="Danh sách unit">☰</button>
  <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>In Use Practice</span></div>
  <nav class="books" id="books"></nav>
  <button class="dataBtn" id="dataBtn" title="Nạp/cập nhật dữ liệu sách">Nạp dữ liệu</button>
  <button class="theme-btn" id="aiBtn" title="Cài API key để AI chấm bài">🔑 AI chấm</button>
  <button class="theme-btn" id="themeBtn" title="Đổi giao diện sáng/tối">Sáng/Tối</button>
</header>
<div class="layout">
  <aside id="side">
    <div class="side-head">
      <h2 id="sideTitle">Units</h2>
      <input class="search" id="search" placeholder="Tìm unit (số hoặc tên)…">
    </div>
    <div class="units" id="units"></div>
  </aside>
  <main id="main"><div class="content" id="content"><div class="empty">Đang tải…</div></div></main>
</div>
<script>window.PUBLIC_BUILD=true;</script>
<script>
(function(){
const BOOKMETA=[
  {id:'vu',short:'Vocab Upper-Int',sub:'Vocabulary in Use · 4th ed',color:'var(--c-vu)',ico:'VU'},
  {id:'va',short:'Vocab Advanced',sub:'Vocabulary in Use · 3rd ed',color:'var(--c-va)',ico:'VA'},
  {id:'gi',short:'Grammar Intermediate',sub:'Grammar in Use · 5th ed',color:'var(--c-gi)',ico:'GI'},
  {id:'ga',short:'Grammar Advanced',sub:'Advanced Grammar in Use · 3rd ed',color:'var(--c-ga)',ico:'GA'},
  {id:'ci',short:'Collocations Int',sub:'Collocations in Use · 2nd ed',color:'var(--c-ci)',ico:'CI'}
];
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem('inuse:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},

/* ---------- answer checking ---------- */
function normalize(s){
  return String(s).normalize('NFKC').toLowerCase()
   .replace(/[’‘`´]/g,"'").replace(/[“”"]/g,'')
   .replace(/✓|✔/g,' tick ').replace(/✗|✘/g,' cross ')
   .replace(/\.\.\.|…/g,' ')
   .replace(/[.,;:!?()\[\]\-–—_\/'·•]/g,' ')
   .replace(/\s+/g,'');
}
const TICK=new Set(['tick','ok','v','yes','correct','right','true','đúng','dung','y','c']);
const CROSS=new Set(['cross','x','no','wrong','false','incorrect','sai','n']);
function variants(ans){
  let a=String(ans).normalize('NFKC');
  const out=new Set();
  // quoted alternatives inside parentheses, e.g. (‘attracts’ is also possible)
  a.replace(/\(([^)]*)\)/g,(m,inner)=>{
    if(/possible|also|likely|or |acceptable|correct/i.test(inner)){
      inner.replace(/[‘'“"]([^’'”"]+)[’'”"]/g,(mm,q)=>{out.add(q);return mm});
      const orm=inner.match(/^(?:or|also)\s+(.+)$/i); if(orm) out.add(orm[1]);
    }
    return m;
  });
  // drop explanatory parentheses (long ones / notes)
  let base=a.replace(/\(([^)]*)\)/g,(m,inner)=>/possible|likely|also|not |or |more|e\.g\.|=|formal|informal|context|meaning|means|less|see /i.test(inner)||inner.split(' ').length>3?'':m).trim();
  // also strip trailing notes after ' – ' or ' - '
  const parts=[base, base.replace(/\s[–-]\s.*$/,'')];
  const alts=[];
  for(const p of parts){
    for(const piece of p.split(/\s+\/\s+|\s*;\s*|\s+or\s+(?=\S)/)){ alts.push(piece) }
    alts.push(p);
  }
  for(let alt of alts){
    alt=alt.trim(); if(!alt) continue;
    out.add(alt);
    // contraction with expansion: ’m (am) measuring
    out.add(alt.replace(/[’']\s?\w+\s*\((\w+)\)/g,'$1').replace(/^(\w+)[’']\w+\s*\((\w+ ?\w*)\)/,'$1 $2'));
    out.add(alt.replace(/\s*\([^)]*\)\s*/g,' '));       // without optional words
    out.add(alt.replace(/[()]/g,''));                  // with optional words
  }
  // whole answer with slashes collapsed
  out.add(a);
  return [...out].map(normalize).filter(Boolean);
}
function judge(user,key){
  const u=normalize(user); const k=normalize(key);
  if(!k && /[—–-]/.test(key)){ const raw=String(user).trim().toLowerCase(); if(['-','—','–','0','x','none','zero','no','no article','ø','∅'].includes(raw)) return true; if(!raw) return null; return false }
  if(!u) return null;
  if(/^(tick|ok)$/.test(k)||k.startsWith('tick')&&k.length<8){ if(TICK.has(u)||u==='tick') return true }
  if(/^cross/.test(k)&&k.length<8){ if(CROSS.has(u)) return true }
  const vs=variants(key);
  if(vs.includes(u)) return true;
  // allow the user to omit the leading word that is printed before the gap? (no) – but accept key prefix-free contractions
  return false;
}

/* ---------- book loading ---------- */
/* IndexedDB store for imported book data (public build) */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('inuse-books',1);r.onupgradeneeded=()=>r.result.createObjectStore('books');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(id){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('books').objectStore('books').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbPut(id,v){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('books','readwrite');tx.objectStore('books').put(v,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function loadBook(id){
  window.BOOKS=window.BOOKS||{};
  if(window.BOOKS[id]) return mergeExtra(id);
  const fromDb=await idbGet(id);
  if(fromDb){window.BOOKS[id]=fromDb;return fromDb}
  if(!window.PUBLIC_BUILD){
    try{await new Promise((res,rej)=>{const s=document.createElement('script');s.src='data/'+id+'.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)}); if(window.BOOKS[id]) return mergeExtra(id)}catch(e){}
  }
  return null;
}
function applyImages(book,imgs){ for(const u of book.units){ const add=imgs[String(u.n)]; if(add) u.images=(u.images||[]).filter(i=>!i.page).concat(add) } return book }
function mergeExtra(id){ const b=window.BOOKS[id]; if(window.EXTRA_IMAGES&&window.EXTRA_IMAGES[id]&&!b.__img){ applyImages(b,window.EXTRA_IMAGES[id]); b.__img=1 } return b }
async function importFiles(files){
  let n=0;
  for(const f of files){
    let txt=await f.text(), data;
    try{
      if(/^\s*window\.BOOKS/.test(txt)){ const i=txt.indexOf(']=')+2; data=JSON.parse(txt.slice(i).replace(/;\s*$/,'')); data={books:{[data.id]:data}} }
      else data=JSON.parse(txt);
    }catch(e){ alert('File '+f.name+' không đúng định dạng dữ liệu sách.'); continue }
    if(data.images){
      for(const id in data.images){ const b=(window.BOOKS&&window.BOOKS[id])||await idbGet(id); if(!b){ alert('Hãy nạp file dữ liệu sách (inuse-data.json) trước, rồi mới nạp file hình.'); continue } applyImages(b,data.images[id]); await idbPut(id,b); window.BOOKS[id]=b; n++ }
      continue;
    }
    const books=data.books||(data.id&&data.units?{[data.id]:data}:{});
    for(const id in books){ await idbPut(id,books[id]); window.BOOKS=window.BOOKS||{}; window.BOOKS[id]=books[id]; n++ }
  }
  return n;
}

/* ---------- theory ---------- */
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[\s(\[‘“])_(.+?)_(?=$|[\s.,;:!?)\]’”])/g,'$1<i>$2</i>').replace(/\^(\d{1,2})\^/g,'<sup>$1</sup>');
}
function plain(s){return String(s).replace(/\*\*|\^\d{1,2}\^/g,'').replace(/(^|\s)_(.+?)_/g,'$1$2')}
function cellHTML(c){return String(c).split('\n').map(md).join('<br>')}
function tableHTML(b){
  const rows=b.rows||[]; let h=`<div class="tw"><table${b.plain?' class="cols"':''}>`;
  rows.forEach((r,i)=>{ const th=b.head&&i===0; h+='<tr>'+r.map(c=>th?`<th>${cellHTML(c)}</th>`:`<td>${cellHTML(c)}</td>`).join('')+'</tr>' });
  return h+'</table></div>';
}
function renderBlocks(bl){
  let h='';
  for(let i=0;i<bl.length;i++){ const b=bl[i];
    if(b.t==='img'&&bl[i+1]&&bl[i+1].t==='img'){ let j=i; const g=[]; while(bl[j]&&bl[j].t==='img'){g.push(bl[j]);j++} const tot=g.reduce((s,x)=>s+(x.w||30),0);
      h+=`<div class="figrow">${g.map(x=>`<img src="${x.src}" alt="hình minh hoạ" loading="lazy" style="width:${Math.max(12,Math.min(100,(x.w||30)*(tot>100?100/tot:1)))-1}%">`).join('')}</div>`; i=j-1; continue }
    if(b.t==='sec') h+=`<div class="sec"><span class="L">${esc(b.l)}</span>${md(b.h||'')}</div>`;
    else if(b.t==='h') h+=`<div class="sub">${md(b.s)}</div>`;
    else if(b.t==='tbl') h+=tableHTML(b);
    else if(b.t==='img') h+=`<figure class="fig"><img src="${b.src}" alt="hình minh hoạ" loading="lazy" style="width:${Math.max(18,b.w||50)}%"></figure>`;
    else if(b.t==='ref') h+=`<p class="hint">${md(b.s)}</p>`;
    else { const s=b.s; const cls=/^(•|–|-)\s?/.test(plain(s))?'bul':(/^\d{1,2}\s/.test(plain(s))&&plain(s).length<140?'gl':''); h+=`<p class="${cls}">${md(s)}</p>`; }
  }
  return h;
}
function renderTheory(text){
  const lines=text.split('\n');
  let html='';
  for(let i=0;i<lines.length;i++){
    const l=lines[i].trim(); if(!l) continue;
    let m;
    if(/^[A-H]$/.test(l)){
      // letter heading; next line may be the section title
      const nxt=(lines[i+1]||'').trim();
      if(nxt && nxt.length<70 && !/^[A-H]$/.test(nxt) && !/[.:]$/.test(nxt) && /^[A-Za-z‘'(]/.test(nxt) && nxt.split(' ').length<10){ html+=`<div class="sec"><span class="L">${l}</span>${esc(nxt)}</div>`; i++; }
      else html+=`<div class="sec"><span class="L">${l}</span></div>`;
      continue;
    }
    if((m=l.match(/^([A-H])\s+([A-Z‘'(].{2,80})$/)) && !/[.,;]$/.test(l) && l.split(' ').length<=12 && !/^(A|I)\s+(am|was|have|think|don|can|will|wish|would|’m|'m)\b/.test(l)){
      html+=`<div class="sec"><span class="L">${m[1]}</span>${esc(m[2])}</div>`; continue;
    }
    if(/^[•–\-]\s?/.test(l)){ html+=`<p class="bul">${esc(l)}</p>`; continue }
    if(/^[a-z(]/.test(l) && html.endsWith('</p>') && !/[.:;?!)]<\/p>$/.test(html)){ html=html.slice(0,-4)+' '+esc(l)+'</p>'; continue }
    html+=`<p>${esc(l)}</p>`;
  }
  return html||'<p class="hint">(Không có nội dung lý thuyết)</p>';
}

/* ---------- exercises ---------- */
function exKey(ex){return 'a:'+state.book+':'+UNIT.key+':'+ex.id}
function lineHTML(l){
  return esc(l).replace(/_{3,}/g,'<span class="gap">_____</span>');
}
function renderExercise(ex, idx){
  const items=(ex.ans.items||[]).filter(it=>String(it.a).trim());
  const byK=new Map(items.map(it=>[it.k,it]));
  const saved=store.get(exKey(ex),{});
  const placed=new Set();
  const lines=(ex.text||'').split('\n');
  let body='';
  let curN=null, firstItemSeen=false;
  lines.forEach((l,i)=>{
    const t=l.trim(); if(!t) return;
    let m, k=null;
    if((m=t.match(/^(\d{1,2})\s+([a-f])\s+/))){ curN=m[1]; k=m[1]+m[2]; if(!byK.has(k)&&byK.has(m[1])) k=m[1]; }
    else if((m=t.match(/^(\d{1,2})(\s|$)/))){ curN=m[1]; k=m[1]; }
    else if(curN && (m=t.match(/^([b-f])\s+/))){ k=curN+m[1]; }
    if(k) firstItemSeen=true;
    if(k && byK.has(k) && !placed.has(k)){
      placed.add(k);
      body+=`<div class="exline item"><span class="txt">${lineHTML(t)}</span>${inputHTML(ex,byK.get(k),saved)}</div>`;
    }else{
      body+=`<div class="exline ${!firstItemSeen&&i===0&&!k?'instr':''}">${lineHTML(t)}</div>`;
    }
  });
  if(!ex.text){
    body+=`<div class="note">Đề bài của bài ${esc(ex.id)} không tách riêng được từ file gốc (thường nằm chung với bài liền trước hoặc là hình/bảng). Bạn vẫn có thể nhập đáp án theo số câu bên dưới.</div>`;
  }
  const rest=items.filter(it=>!placed.has(it.k));
  if(rest.length){
    body+=`<div class="extra"><h4>${placed.size?'Các câu khác':'Nhập đáp án theo số câu'}</h4><div class="grid">${rest.map(it=>`<div class="cell">${inputHTML(ex,it,saved,true)}</div>`).join('')}</div></div>`;
  }
  const hasItems=items.length>0;
  if(!hasItems){
    body+=`<textarea class="free" data-free="1" placeholder="Viết câu trả lời của bạn ở đây, rồi bấm “Xem đáp án” để tự so sánh…">${esc(saved.__free||'')}</textarea>`;
  }
  const open=ex.ans.open;
  return `<section class="excard" data-ex="${idx}">
    <div class="exhead"><span class="id">${esc(ex.id)}</span>${open&&ex.key?'<span class="tag">Đáp án gợi ý</span>':''}${!ex.key?(UNIT.u.keyAll?'<span class="tag">Xem đáp án cả unit ở trên</span>':'<span class="tag">Không có đáp án trong sách</span>'):''}<span class="score"></span></div>
    <div class="exbody">${body}</div>
    <div class="aibox" hidden></div>
    <div class="keybox" hidden><span class="kt">Đáp án (Answer key)</span>${esc(ex.key||'Sách không có đáp án cho bài này (bài tự luận / Over to you).')}</div>
    <div class="actions">
      ${hasItems?'<button class="btn primary" data-act="check">Kiểm tra</button>':''}
      <button class="btn" data-act="key">Xem đáp án</button>
      ${hasItems?'<button class="btn" data-act="reveal">Điền đáp án</button>':''}
      <button class="btn" data-act="reset">Làm lại</button>
      <button class="btn ai" data-act="ai" title="Gửi bài làm cho AI (Gemini) chấm và nhận xét">🤖 AI chấm</button>
    </div>
  </section>`;
}
function inputHTML(ex,it,saved,withLabel){
  const v=saved[it.k]||'';
  return `<span class="ans-wrap"><span class="lbl">${esc(it.k)}</span><input class="ans" data-k="${esc(it.k)}" value="${esc(v)}" autocomplete="off" spellcheck="false" placeholder="câu ${esc(it.k)}"><span class="mark"></span></span><span class="sol" data-sol="${esc(it.k)}" hidden></span>`;
}

function renderUnit(){

  const tab=(state.tab[state.book+':'+UNIT.key])||(isAdd?'ex':'theory');
  const nEx=u.exercises.length;
  const list=unitList(); const pos=list.findIndex(x=>x.key===UNIT.key);
  const prev=list[pos-1], next=list[pos+1];
  let html=`<div class="crumb">${esc(BOOK.title)}</div>
   <h1>${isAdd?'':'Unit '+u.n+' · '}${esc(u.title)}</h1>
   <div class="unit-sum" id="unitSum"></div>
   <div class="tabs">${!isAdd?`<button class="tab ${tab==='theory'?'active':''}" data-t="theory">Lý thuyết</button>`:''}<button class="tab ${tab==='ex'?'active':''}" data-t="ex">Bài tập (${nEx})</button>${!isAdd?`<button class="btn pgbtn" id="pgBtn" title="Xem trang sách gốc bên cạnh">📄 Trang gốc</button><button class="btn primary lecbtn" id="lecBtn" title="Slide hoạt ảnh, giọng đọc tiếng Anh">▶ Bài giảng</button>`:''}</div>`;
  const imgs=(u.images||[]).filter(i=>i.kind===(tab==='theory'?'theory':'ex'));
  const isPage=imgs.length&&imgs[0].page;
  const imgHtml=imgs.length?`<details class="imgs" ${isPage?'':'open'}><summary>${isPage?'Xem trang sách gốc (có hình minh hoạ)':'Hình minh hoạ trong sách ('+imgs.length+')'}</summary><div class="imgrow">${imgs.map(i=>`<img src="${i.src}" alt="hình minh hoạ" loading="lazy" style="${i.page?'width:100%':''}">`).join('')}</div></details>`:'';
  if(tab==='theory' && !isAdd){
    html+=((u.theoryBlocks||[]).some(b=>b.t==='img')?'':imgHtml)+`<div class="theory">${u.theoryBlocks?renderBlocks(u.theoryBlocks):renderTheory(u.theory||'')}</div>`;
    if(!u.theoryBlocks) html+=`<p class="hint">Unit này chưa có bản lý thuyết đã định dạng. Nếu bạn đang mở bản cũ, hãy đóng tab và mở lại file mới.</p>`;
  }else{
    html+=imgHtml;
    if(u.keyAll) html+=`<details class="keyall"><summary>Đáp án cả unit (sách gốc không tách được theo từng bài)</summary><div class="keybox" style="margin:10px 0 0">${esc(u.keyAll)}</div></details>`;
    if(u.exHeader) html+=`<div class="exline hint" style="margin-bottom:12px;white-space:pre-wrap">${lineHTML(u.exHeader)}</div>`;
    html+=u.exercises.map((ex,i)=>renderExercise(ex,i)).join('');
  }
  html+=`<div class="pager">${prev?`<button data-go="${prev.key}">← ${prev.key==='add'?'':'Unit '+prev.n+': '}${esc(prev.title)}</button>`:'<span></span>'}${next?`<button data-go="${next.key}" style="text-align:right">${next.key==='add'?'':'Unit '+next.n+': '}${esc(next.title)} →</button>`:''}</div>`;
  $('#content').innerHTML=html;
  $('#main').scrollTop=0;
  $('#content').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab[state.book+':'+UNIT.key]=b.dataset.t;store.set('state',state);renderUnit()});
  $('#content').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>selectUnit(b.dataset.go==='add'?'add':+b.dataset.go));
  $('#content').querySelectorAll('.excard').forEach(card=>wireCard(card,u.exercises[+card.dataset.ex]));
  const lb=$('#lecBtn'); if(lb) lb.onclick=()=>Lecture.open(u);
  const pb=$('#pgBtn'); if(pb) pb.onclick=()=>{ Pages.on=!Pages.on; store.set('pgOn',Pages.on); Pages.show(tab) };
  Pages.show(tab);
  $('#content').querySelectorAll('.fig img,.figrow img').forEach(i=>i.onclick=()=>i.classList.toggle('zoom'));
  updateUnitSummary();
}

function wireCard(card,ex){
  const save=()=>{const o={};card.querySelectorAll('.ans').forEach(i=>{if(i.value)o[i.dataset.k]=i.value});const f=card.querySelector('[data-free]');if(f&&f.value)o.__free=f.value;store.set(exKey(ex),o)};
  card.addEventListener('input',e=>{ if(e.target.matches('.ans')){e.target.classList.remove('ok','bad','ref');e.target.parentElement.querySelector('.mark').textContent='';} save() });
  card.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches('.ans')){ e.preventDefault(); const all=[...card.querySelectorAll('.ans')]; const i=all.indexOf(e.target); if(i<all.length-1) all[i+1].focus(); else check(card,ex,true) } });
  card.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.act;
    if(a==='check') check(card,ex,true);
    if(a==='ai'){ save(); AI.grade(card,ex); return }
    if(a==='key'){ const k=card.querySelector('.keybox'); k.hidden=!k.hidden; b.textContent=k.hidden?'Xem đáp án':'Ẩn đáp án' }
    if(a==='reveal'){ card.querySelectorAll('.ans').forEach(i=>{ const it=ex.ans.items.find(x=>x.k===i.dataset.k); if(it){ const sol=card.querySelector(`[data-sol="${CSS.escape(it.k)}"]`); sol.hidden=false; sol.innerHTML='<b>Đáp án:</b> '+esc(it.a);} }) }
    if(a==='reset'){ store.set(exKey(ex),{}); card.querySelectorAll('.ans').forEach(i=>{i.value='';i.classList.remove('ok','bad','ref');i.parentElement.querySelector('.mark').textContent=''}); card.querySelectorAll('.sol').forEach(s=>s.hidden=true); const f=card.querySelector('[data-free]'); if(f) f.value=''; card.querySelector('.score').textContent=''; recordScore(ex,0,0,true) }
  });
  // restore marks if previously checked
  const sc=store.get('s:'+exKey(ex),null);
  if(sc && sc.checked) check(card,ex,false);
}
function check(card,ex,showSol){
  let ok=0,total=0;
  const open=ex.ans.open;
  card.querySelectorAll('.ans').forEach(i=>{
    const it=ex.ans.items.find(x=>x.k===i.dataset.k); if(!it) return;
    total++;
    const r=judge(i.value,it.a);
    const mk=i.parentElement.querySelector('.mark');
    const sol=card.querySelector(`[data-sol="${CSS.escape(it.k)}"]`);
    i.classList.remove('ok','bad','ref');
    if(r===true){ ok++; i.classList.add('ok'); mk.className='mark ok'; mk.textContent='✓'; if(sol) sol.hidden=true }
    else if(r===null){ mk.textContent=''; mk.className='mark'; }
    else{
      i.classList.add(open?'ref':'bad'); mk.className='mark '+(open?'ref':'bad'); mk.textContent=open?'≈':'✗';
      if(sol&&showSol!==false){ sol.hidden=false; sol.innerHTML=(open?'<b>Gợi ý:</b> ':'<b>Đáp án:</b> ')+esc(it.a) }
    }
  });
  const s=card.querySelector('.score');
  s.textContent=total?`${ok}/${total} đúng`:''; s.classList.toggle('good',total&&ok===total);
  recordScore(ex,ok,total,false);
}
function recordScore(ex,ok,total,reset){
  store.set('s:'+exKey(ex),reset?null:{checked:true,ok,total});
  // unit progress
  let O=0,T=0;
  for(const e of UNIT.u.exercises){ const n=(e.ans.items||[]).length; if(!n) continue; T+=n; const s=store.get('s:a:'+state.book+':'+UNIT.key+':'+e.id,null); if(s&&s.checked) O+=s.ok }
  store.set('p:'+state.book+':'+UNIT.key,{ok:O,total:T});
  updateUnitSummary();
  const el=$(`#units .unit-link[data-k="${UNIT.key}"] .prog`);
  if(el){el.textContent=`${O}/${T}`;el.classList.toggle('full',O>=T)} else renderUnits();
}
function updateUnitSummary(){
  const p=progressOf(UNIT.key); const el=$('#unitSum'); if(!el) return;
  const T=UNIT.u.exercises.reduce((a,e)=>a+(e.ans.items||[]).length,0);
  const O=p?p.ok:0;
  el.innerHTML=`<span>${UNIT.u.exercises.length} bài tập · ${T} câu có đáp án</span>${T?`<span class="bar"><i style="width:${Math.round(100*O/T)}%"></i></span><span>${O}/${T} đúng</span>`:''}`;
}

  }};

/* ---------- AI grading (Gemini) ---------- */
const AI=(()=>{
  const K='inuse-ai-key', M='inuse-ai-model';
  const ls=(()=>{try{return window.localStorage}catch(e){return null}})(), ss=(()=>{try{return window.sessionStorage}catch(e){return null}})();
  const getKey=()=>{ try{ return (ss&&ss.getItem(K))||(ls&&ls.getItem(K))||'' }catch(e){return ''} };
  const getModel=()=>{ try{ return (ls&&ls.getItem(M))||'gemini-2.5-flash' }catch(e){return 'gemini-2.5-flash'} };
  function setKey(k,remember){ try{ ls&&ls.removeItem(K); ss&&ss.removeItem(K); if(k) (remember?ls:ss).setItem(K,k) }catch(e){} }
  function dlg(){
    let d=$('#aiDlg'); if(!d){ d=document.createElement('div'); d.id='aiDlg'; document.body.appendChild(d);
      d.addEventListener('click',e=>{ if(e.target===d) d.classList.remove('on') }); }
    const has=!!getKey();
    d.innerHTML=`<div class="box"><h3>🔑 API key để AI chấm bài</h3>
      <div class="hint">Dùng key Gemini (Google AI Studio). Key chỉ được lưu trong trình duyệt trên máy này. Key không nằm trong file app, không hiện lại trên màn hình, và chỉ được gửi tới máy chủ Google (generativelanguage.googleapis.com) khi bạn bấm "🤖 AI chấm".</div>
      <label>API key ${has?'(đã lưu: ••••'+esc(getKey().slice(-4))+')':''}</label>
      <input type="password" id="aiKey" placeholder="${has?'Để trống nếu giữ key cũ':'Dán key vào đây'}" autocomplete="off" spellcheck="false">
      <label><input type="checkbox" id="aiRem" ${has&&ls&&ls.getItem(K)?'checked':(!has?'checked':'')}> Nhớ key trên máy này (bỏ chọn thì key tự xoá khi đóng trình duyệt)</label>
      <label>Model</label><input type="text" id="aiModel" value="${esc(getModel())}">
      <div class="row"><button class="btn primary" id="aiSave">Lưu</button><button class="btn" id="aiTest">Thử key</button><button class="btn" id="aiDel">Xoá key</button><button class="btn" id="aiClose" style="margin-left:auto">Đóng</button></div>
      <div class="st" id="aiSt"></div></div>`;
    d.classList.add('on');
    const st=m=>$('#aiSt').textContent=m;
    $('#aiClose').onclick=()=>d.classList.remove('on');
    $('#aiSave').onclick=()=>{ const v=$('#aiKey').value.trim(); const rem=$('#aiRem').checked; setKey(v||getKey(),rem); try{ls&&ls.setItem(M,$('#aiModel').value.trim()||'gemini-2.5-flash')}catch(e){} $('#aiKey').value=''; st(getKey()?'Đã lưu ✓':'Chưa có key'); };
    $('#aiDel').onclick=()=>{ setKey('',false); st('Đã xoá key khỏi máy này.'); };
    $('#aiTest').onclick=async()=>{ const v=$('#aiKey').value.trim(); if(v) setKey(v,$('#aiRem').checked); $('#aiKey').value=''; st('Đang thử…'); try{ await call('Reply with the single word OK.'); st('Key dùng được ✓') }catch(e){ st('Lỗi: '+e.message) } };
  }
  async function call(prompt, json){
    const key=getKey(); if(!key) throw new Error('chưa có API key');
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(getModel())}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:Object.assign({temperature:0.2},json?{responseMimeType:'application/json'}:{})})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
    return ((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('');
  }
  async function grade(card,ex){
    const box=card.querySelector('.aibox'); box.hidden=false;
    if(!getKey()){ box.innerHTML='Bạn chưa nhập API key. Bấm nút <b>🔑 AI chấm</b> ở trên cùng để thêm key.'; return }
    const answers=[...card.querySelectorAll('.ans')].map(i=>({k:i.dataset.k,a:i.value.trim()}));
    const free=(card.querySelector('[data-free]')||{}).value||'';
    if(!answers.some(x=>x.a)&&!free.trim()){ box.textContent='Bạn chưa làm câu nào.'; return }
    box.textContent='🤖 AI đang chấm…';
    const prompt=`You are an English teacher grading a student's exercise from "${BOOK.title}", Unit ${UNIT.u.n}: ${UNIT.u.title}.
Exercise ${ex.id}:
${ex.text||'(exercise text not available)'}

Answer key from the book (may say "possible answers"):
${ex.key||UNIT.u.keyAll||'(no key in the book: judge on correctness and naturalness)'}

Student answers (item -> answer):
${answers.map(x=>x.k+': '+(x.a||'(blank)')).join('\n')}
${free.trim()?'\nStudent free writing:\n'+free:''}

Grade each item. Accept answers that are correct English and fit the exercise even if they differ from the key. Explain mistakes briefly in Vietnamese, quoting the English. Return JSON: {"items":[{"k":"<item>","ok":true|false|null,"comment":"<Vietnamese, short>"}],"overall":"<Vietnamese summary, 1-3 sentences; for free writing give corrections>"}. Use ok=null for blank items.`;
    try{
      const out=await call(prompt,true); let j; try{ j=JSON.parse(out) }catch(e){ j={overall:out,items:[]} }
      let ok=0,n=0;
      for(const it of (j.items||[])){
        const inp=card.querySelector(`.ans[data-k="${CSS.escape(String(it.k))}"]`); if(!inp) continue;
        const sol=card.querySelector(`[data-sol="${CSS.escape(String(it.k))}"]`);
        if(it.ok!==null&&it.ok!==undefined){ n++; if(it.ok) ok++; inp.classList.remove('ok','bad','ref'); inp.classList.add(it.ok?'ok':'bad'); const mk=inp.parentElement.querySelector('.mark'); if(mk) mk.textContent=it.ok?'✓':'✗' }
        if(sol&&it.comment){ sol.hidden=false; sol.innerHTML='🤖 '+esc(it.comment) }
      }
      box.innerHTML=`<b>🤖 AI nhận xét${n?` (${ok}/${n} câu đúng)`:''}:</b>\n`+esc(j.overall||'');
    }catch(e){ box.textContent='Không chấm được: '+e.message }
  }
  return {dlg,grade,getKey};
})();

/* ---------- lecture mode ---------- */
const Lecture=(()=>{
  let slides=[],si=0,pi=0,playing=false,rate=store.get('lecRate',1),voiceName=store.get('lecVoice',''),unit=null,token=0;
  const synth=window.speechSynthesis;
  function voices(){ return (synth?synth.getVoices():[]).filter(v=>/^en/i.test(v.lang)) }
  function pickVoice(){ const vs=voices(); return vs.find(v=>v.name===voiceName)||vs.find(v=>/en-GB/i.test(v.lang)&&/natural|online|neural/i.test(v.name))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/natural|online|neural/i.test(v.name))||vs[0] }
  function build(u){
    const bl=u.theoryBlocks||(u.theory||'').split('\n').filter(Boolean).map(s=>({t:'p',s}));
    const imgs=(u.images||[]).filter(i=>i.kind==='theory'&&!i.page);
    const out=[{cover:true}];
    let cur=null;
    const push=()=>{ if(cur&&cur.paras.length) out.push(cur) };
    for(const b of bl){
      if(b.t==='sec'){ push(); cur={l:b.l,h:b.h||'',paras:[]}; continue }
      if(b.t==='ref') continue;
      if(b.t==='img'){ if(!cur) cur={l:'',h:'',paras:[]}; (cur.imgs=cur.imgs||[]).push({src:b.src}); continue }
      if(b.t==='tbl'){ if(!cur) cur={l:'',h:'',paras:[]};
        const rows=b.rows.filter(r=>r.some(c=>plain(c).trim()));
        for(let k=0;k<rows.length;k+=4){ cur.paras.push({tbl:{rows:rows.slice(k,k+4),head:b.head&&k===0}, say:rows.slice(k,k+4).map(r=>r.filter(c=>c).map(c=>plain(c).replace(/\n/g,'. ')).join(': ')).join('. ')}); if(cur.paras.length>=5){ push(); cur={l:cur.l,h:cur.h?cur.h.replace(/ \(tiếp\)$/,'')+' (tiếp)':'',paras:[]} } }
        continue }
      if(!cur) cur={l:'',h:'',paras:[]};
      if(b.t==='h'){ if(!cur.paras.length){cur.h=cur.h&&!cur.l?cur.h+' · '+b.s:(cur.h||b.s);continue} if(!cur.l||plain(b.s).length<50){ push(); cur={l:cur.l&&!cur.l?'':'',h:b.s,paras:[]}; continue } }
      const txt=b.t==='h'?'**'+b.s+'**':b.s;
      if(plain(txt).replace(/[^A-Za-z]/g,'').length<2) continue;
      // merge very short lines into previous para for nicer slides
      const last=cur.paras[cur.paras.length-1];
      if(last && typeof last==='string' && plain(last).length<60 && plain(txt).length<60 && !/[.:?!]$/.test(plain(last))) cur.paras[cur.paras.length-1]=last+' · '+txt;
      else cur.paras.push(txt);
      if(cur.paras.length>=6){ const im=cur.imgs; push(); cur={l:cur.l,h:cur.h?cur.h.replace(/ \(tiếp\)$/,'')+' (tiếp)':'',paras:[],imgs:im&&im.length>1?im.slice(1):null} }
    }
    push();
    const anyInline=bl.some(b=>b.t==='img');
    let k=0; for(const s of out){ if(s.cover) continue; if(s.imgs&&s.imgs.length) s.img=s.imgs[0]; else if(!anyInline&&imgs.length){ s.img=imgs[k%imgs.length]; k++ } }
    return out;
  }
  function el(){ let d=$('#lec'); if(d) return d;
    d=document.createElement('div'); d.id='lec';
    d.innerHTML=`<div class="bg"><i></i><i></i><i></i></div>
      <div class="top"><span class="t" id="lecT"></span><button class="x" id="lecX">✕ Đóng</button></div>
      <div class="stage" id="lecStage"></div>
      <div class="ctl"><button id="lecPrev" title="Slide trước">⏮</button><button class="play" id="lecPlay">▶ Phát</button><button id="lecNext" title="Slide sau">⏭</button>
        <div class="prog"><i id="lecProg"></i></div><span class="cap" id="lecCap"></span>
        <select id="lecRate" title="Tốc độ đọc"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1">1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option></select>
        <select id="lecVoice" title="Giọng đọc"></select></div>`;
    document.body.appendChild(d);
    $('#lecX').onclick=close; $('#lecPrev').onclick=()=>go(si-1); $('#lecNext').onclick=()=>go(si+1);
    $('#lecPlay').onclick=()=>playing?pause():play();
    $('#lecRate').value=String(rate); $('#lecRate').onchange=e=>{rate=+e.target.value;store.set('lecRate',rate); if(playing){stopSpeech();speak()}};
    $('#lecVoice').onchange=e=>{voiceName=e.target.value;store.set('lecVoice',voiceName); if(playing){stopSpeech();speak()}};
    const fill=()=>{ const vs=voices(), v=pickVoice(); $('#lecVoice').innerHTML=vs.length?vs.map(x=>`<option ${v&&x.name===v.name?'selected':''}>${esc(x.name)}</option>`).join(''):'<option>(máy chưa có giọng tiếng Anh)</option>' };
    fill(); if(synth) synth.onvoiceschanged=fill;
    document.addEventListener('keydown',e=>{ if(!$('#lec.on')) return; if(e.key==='Escape') close(); if(e.key===' '){e.preventDefault();playing?pause():play()} if(e.key==='ArrowRight') go(si+1); if(e.key==='ArrowLeft') go(si-1) });
    return d;
  }
  const BOOKSVG=`<svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="56" fill="rgba(255,255,255,.08)"/><path d="M28 38c10-4 22-4 32 3v46c-10-7-22-7-32-3z" fill="#ffd166"/><path d="M92 38c-10-4-22-4-32 3v46c10-7 22-7 32-3z" fill="#fff" opacity=".9"/><path d="M60 41v46" stroke="#0d1020" stroke-width="2"/><circle cx="86" cy="28" r="6" fill="#2bb3a3"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle></svg>`;
  function render(){
    const s=slides[si]; const st=$('#lecStage');
    if(s.cover){
      st.innerHTML=`<div class="slide noimg cover"><div>${BOOKSVG}<div class="k">${esc(BOOK.title)}</div><h2>${UNIT.key==='add'?'':'Unit '+esc(unit.n)+'<br>'}${esc(unit.title)}</h2><p style="opacity:.75">${slides.length-1} phần · bấm ▶ Phát hoặc phím Space</p></div></div>`;
    }else{
      st.innerHTML=`<div class="slide ${s.img?'':'noimg'}"><div><div class="stitle">${s.l?`<span class="L">${esc(s.l)}</span>`:''}<span>${md(s.h||unit.title)}</span></div>${s.paras.map((p,i)=>`<div class="para ${i<pi?'done':''} ${i===pi?'cur':''}" data-i="${i}">${typeof p==='string'?md(p):tableHTML(p.tbl)}</div>`).join('')}</div>${s.img?`<div class="pic">${(s.imgs&&s.imgs.length?s.imgs.slice(0,3):[s.img]).map(i=>`<img src="${i.src}" alt="hình minh hoạ">`).join('')}</div>`:''}</div>`;
      st.querySelectorAll('.para').forEach(p=>p.onclick=()=>{pi=+p.dataset.i;mark();if(playing){stopSpeech();speak()}});
    }
    $('#lecProg').style.width=Math.round(100*si/Math.max(1,slides.length-1))+'%';
    $('#lecCap').textContent=`${si+1}/${slides.length}`;
  }
  function mark(){ $('#lecStage').querySelectorAll('.para').forEach((p,i)=>{p.classList.toggle('cur',i===pi);p.classList.toggle('done',i<pi); if(i===pi) p.scrollIntoView({block:'nearest',behavior:'smooth'})}) }
  function stopSpeech(){ token++; if(synth) synth.cancel() }
  function textFor(){ const s=slides[si]; if(s.cover) return (UNIT.key==='add'?'':'Unit '+unit.n+'. ')+unit.title; if(pi===-1) return plain(s.h||''); const P=s.paras[pi]; if(P&&typeof P!=='string') return P.say; return plain(P||'').replace(/\s·\s/g,'. ').replace(/\(=/g,'(meaning').replace(/➜/g,'see') }
  function speak(){
    if(!synth){ $('#lecCap').textContent='Trình duyệt này không hỗ trợ đọc to'; return }
    const my=++token; const s=slides[si];
    const txt=textFor();
    const u=new SpeechSynthesisUtterance(txt); const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang} else u.lang='en-GB'; u.rate=rate;
    u.onend=()=>{ if(my!==token||!playing) return; advance() };
    u.onerror=()=>{ if(my!==token) return; if(playing) setTimeout(advance,400) };
    synth.speak(u);
  }
  function advance(){
    const s=slides[si];
    if(s.cover){ if(si+1<slides.length){ si++; pi=0; render(); setTimeout(()=>{ if(playing) speak() },500) } else pause(); return }
    if(pi+1<s.paras.length){ pi++; mark(); speak(); return }
    if(si+1<slides.length){ si++; pi=0; render(); setTimeout(()=>{ if(playing) speak() },500); return }
    pause(); $('#lecCap').textContent='Hết bài ✓';
  }
  function play(){ playing=true; $('#lecPlay').textContent='⏸ Dừng'; speak() }
  function pause(){ playing=false; stopSpeech(); $('#lecPlay').textContent='▶ Phát' }
  function go(n){ if(n<0||n>=slides.length) return; stopSpeech(); si=n; pi=0; render(); if(playing) setTimeout(speak,350) }
  function open(u){ unit=u; slides=build(u); si=0; pi=0; el().classList.add('on'); $('#lecT').textContent=(BOOK.title||'')+' — '+u.title; render(); pause() }
  function close(){ pause(); const d=$('#lec'); if(d) d.classList.remove('on') }
  return {open,close};
})();

renderBooks();
selectBook(state.book);
})();
